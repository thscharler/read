[package]
name = "read"
version = "0.1.0"
edition = "2024"

[features]
default = []

wgpu = ["rat-salsa-switch/wgpu"]
term = ["rat-salsa-switch/term"]

[dependencies]
anyhow = "1.0"
ratatui = "0.30"
crossterm = "0.29"
fern = "0.7"
log = "0.4"
dirs = "7.0"
configparser = { version = "3.1", features = ["indexmap"] }

rat-salsa-switch = { version = "0.1", path = "../rat-salsa-switch", features = ["dialog_widgets"] }
rat-widget = { version = "3.2", features = ["user_directories", "cli-clipboard"] }
rat-theme4 = { version = "4.5" }

[[bin]]
name = "read-wgpu"
path = "src/main.rs"
required-features = ["wgpu"]

[[bin]]
name = "read"
path = "src/main.rs"
required-features = ["term"]